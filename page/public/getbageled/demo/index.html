<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bagel² demo</title>
<meta name="description" content="Bagel²: one app that runs your business.">
<style>
html,body{margin:0;height:100%;background:#fff}
body{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slide[hidden]{display:none}
.controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;padding:4px;border-radius:999px;background:#fff;box-shadow:0 4px 12px #1e23101f;color:#1e2310;font:700 15px/1 system-ui,sans-serif}
.controls button{width:36px;height:36px;border:0;border-radius:999px;background:transparent;color:inherit;font:inherit;font-size:20px;cursor:pointer}
.controls button:hover:not(:disabled){background:#f1f5e4}
.controls button:disabled{opacity:.3;cursor:default}
.count{min-width:48px;text-align:center}
</style>
</head>
<body>
<img class="slide" src="/getbageled/demo/1.avif" width="2138" height="1279" alt="No onboarding. Connect to your existing apps.">
<img class="slide" src="/getbageled/demo/2.avif" width="2138" height="1279" alt="Track your inventory. Bagel² will help you with the reordering." hidden>
<img class="slide" src="/getbageled/demo/3.avif" width="2138" height="1279" alt="Recipes created for you. No manual entry." hidden>
<img class="slide" src="/getbageled/demo/4.avif" width="2138" height="1279" alt="See how your business is doing." hidden>
<nav class="controls" aria-label="Slides">
<button type="button" class="prev" aria-label="Previous slide">&lsaquo;</button>
<span class="count" aria-live="polite"></span>
<button type="button" class="next" aria-label="Next slide">&rsaquo;</button>
</nav>
<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const prev = document.querySelector('.prev');
  const next = document.querySelector('.next');
  const count = document.querySelector('.count');
  const fromHash = () => Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), slides.length - 1);
  let current = 0;

  function show(i) {
    current = i;
    slides.forEach((slide, n) => { slide.hidden = n !== i; });
    count.textContent = (i + 1) + ' / ' + slides.length;
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
  }
  function go(i) {
    if (i < 0 || i >= slides.length) return;
    history.replaceState(null, '', '#' + (i + 1));
    show(i);
  }

  prev.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  document.addEventListener('click', e => {
    if (e.target.closest('.controls')) return;
    go(e.clientX < innerWidth / 3 ? current - 1 : current + 1);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(current - 1);
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(current + 1); }
  });
  let x0 = null;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 50) { e.preventDefault(); go(current + (dx < 0 ? 1 : -1)); }
  });
  addEventListener('hashchange', () => show(fromHash()));
  show(fromHash());
})();
</script>
</body>
</html>
